<svg width="200" height="50" viewBox="0 0 200 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#667eea;stop-opacity:1" />
    </linearGradient>
    <filter id="textShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Main text with gradient -->
  <text x="10" y="32" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="url(#textGradient)" filter="url(#textShadow)">
    ChemLab<tspan font-weight="900" fill="#764ba2">X</tspan>
  </text>
  
  <!-- Tagline -->
  <text x="12" y="44" font-family="'Segoe UI', system-ui, sans-serif" font-size="8" font-weight="500" fill="#667eea" opacity="0.7">
    Kimya Eğitim Platformu
  </text>
</svg>