<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="24" cy="24" r="22" fill="url(#iconGradient)" filter="url(#shadow)"/>
  
  <!-- Flask silhouette -->
  <g transform="translate(24, 12)">
    <path d="M -6 0 L -6 6 L -10 18 C -10 21 -8 23 0 23 C 8 23 10 21 10 18 L 6 6 L 6 0 Z" 
          fill="white" opacity="0.95"/>
    
    <!-- Liquid -->
    <path d="M -9 16 C -9 19 -7 21 0 21 C 7 21 9 19 9 16 L 6 6 L -6 6 Z" 
          fill="#667eea" opacity="0.3"/>
    
    <!-- Atom symbol -->
    <circle cx="0" cy="14" r="1.5" fill="#667eea"/>
    <ellipse cx="0" cy="14" rx="5" ry="2.5" fill="none" stroke="#667eea" stroke-width="1" opacity="0.6"/>
    <circle cx="-5" cy="14" r="1" fill="white"/>
    <circle cx="5" cy="14" r="1" fill="white"/>
  </g>
</svg>