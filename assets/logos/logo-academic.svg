<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="logoGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:0.3" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Modern Flask with Atom Symbol -->
  <g transform="translate(10, 8)">
    <!-- Outer glow circle -->
    <circle cx="20" cy="22" r="22" fill="url(#logoGlow)" opacity="0.3"/>
    
    <!-- Flask container -->
    <path d="M 20 8 L 20 15 L 12 30 C 12 35 15 38 20 38 C 25 38 28 35 28 30 L 20 15 Z" 
          fill="none" stroke="url(#logoGradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    
    <!-- Liquid with gradient -->
    <path d="M 13 28 C 13 32 16 35 20 35 C 24 35 27 32 27 28 L 20 15 Z" 
          fill="url(#logoGradient)" opacity="0.4"/>
    
    <!-- Atom nucleus -->
    <circle cx="20" cy="26" r="2.5" fill="url(#logoGradient)"/>
    
    <!-- Electron orbits -->
    <ellipse cx="20" cy="26" rx="8" ry="4" fill="none" stroke="url(#logoGradient)" stroke-width="1.2" opacity="0.6"/>
    <ellipse cx="20" cy="26" rx="4" ry="8" fill="none" stroke="url(#logoGradient)" stroke-width="1.2" opacity="0.6"/>
    
    <!-- Electrons -->
    <circle cx="28" cy="26" r="1.5" fill="#667eea"/>
    <circle cx="20" cy="18" r="1.5" fill="#764ba2"/>
  </g>

  <!-- Text with modern font -->
  <text x="50" y="28" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="url(#logoGradient)">ChemLab</text>
  <text x="138" y="28" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#764ba2">X</text>
  <text x="50" y="42" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="500" fill="#667eea" opacity="0.7">Kimya Eğitim Platformu</text>
</svg>