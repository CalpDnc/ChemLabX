<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="atomGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="electronGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="0.8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Central nucleus -->
  <circle cx="12" cy="12" r="3" fill="url(#atomGradient)" filter="url(#glow)"/>
  
  <!-- Electron orbits -->
  <ellipse cx="12" cy="12" rx="10" ry="5" fill="none" stroke="url(#atomGradient)" stroke-width="1.5" opacity="0.6" stroke-dasharray="2,2"/>
  <ellipse cx="12" cy="12" rx="5" ry="10" fill="none" stroke="url(#atomGradient)" stroke-width="1.5" opacity="0.6" stroke-dasharray="2,2"/>
  <ellipse cx="12" cy="12" rx="8" ry="8" fill="none" stroke="url(#atomGradient)" stroke-width="1.5" opacity="0.6" stroke-dasharray="2,2"/>
  
  <!-- Electrons -->
  <circle cx="22" cy="12" r="2" fill="url(#electronGradient)" filter="url(#glow)"/>
  <circle cx="12" cy="2" r="2" fill="url(#electronGradient)" filter="url(#glow)"/>
  <circle cx="2" cy="12" r="2" fill="url(#electronGradient)" filter="url(#glow)"/>
  <circle cx="17" cy="17" r="1.5" fill="url(#electronGradient)" filter="url(#glow)" opacity="0.8"/>
  <circle cx="7" cy="7" r="1.5" fill="url(#electronGradient)" filter="url(#glow)" opacity="0.8"/>
</svg>
