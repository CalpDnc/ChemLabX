<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="quizGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="paperGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5f7fa;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Paper/Document background -->
  <rect x="4" y="2" width="16" height="20" rx="2" fill="url(#paperGradient)" stroke="url(#quizGradient)" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Question marks and checkmarks -->
  <!-- Question mark 1 -->
  <path d="M 8 6 Q 8 5 9 5 Q 10 5 10 6 Q 10 7 9 7.5 L 9 8.5" stroke="url(#quizGradient)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <circle cx="9" cy="10" r="0.5" fill="url(#quizGradient)"/>
  
  <!-- Checkmark 1 -->
  <path d="M 14 6 L 15.5 7.5 L 18 5" stroke="#4ade80" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Question mark 2 -->
  <path d="M 8 13 Q 8 12 9 12 Q 10 12 10 13 Q 10 14 9 14.5 L 9 15.5" stroke="url(#quizGradient)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <circle cx="9" cy="17" r="0.5" fill="url(#quizGradient)"/>
  
  <!-- Checkmark 2 -->
  <path d="M 14 13 L 15.5 14.5 L 18 12" stroke="#4ade80" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Star/badge icon in corner -->
  <circle cx="19" cy="4" r="3.5" fill="url(#quizGradient)" filter="url(#shadow)"/>
  <path d="M 19 2.5 L 19.5 3.5 L 20.5 3.7 L 19.8 4.4 L 20 5.5 L 19 5 L 18 5.5 L 18.2 4.4 L 17.5 3.7 L 18.5 3.5 Z" fill="white"/>
</svg>
