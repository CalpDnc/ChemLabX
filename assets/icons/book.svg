<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bookGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Book pages -->
  <path d="M 4 3 L 4 19 C 4 20 5 21 6 21 L 18 21 C 19 21 20 20 20 19 L 20 3 Z" 
        fill="white" stroke="url(#bookGradient)" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Book spine highlight -->
  <line x1="6" y1="3" x2="6" y2="21" stroke="url(#bookGradient)" stroke-width="1" opacity="0.3"/>
  
  <!-- Formula on page -->
  <text x="12" y="10" text-anchor="middle" font-size="6" font-weight="bold" fill="url(#bookGradient)">H₂O</text>
  <text x="12" y="16" text-anchor="middle" font-size="5" font-weight="bold" fill="url(#bookGradient)">CO₂</text>
  
  <!-- Page lines -->
  <line x1="8" y1="12" x2="16" y2="12" stroke="url(#bookGradient)" stroke-width="0.5" opacity="0.3"/>
  <line x1="8" y1="18" x2="16" y2="18" stroke="url(#bookGradient)" stroke-width="0.5" opacity="0.3"/>
</svg>
