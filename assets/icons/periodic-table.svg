<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ptGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ptGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ptGradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Modern grid layout -->
  <rect x="2" y="2" width="20" height="20" rx="3" fill="none" stroke="url(#ptGradient1)" stroke-width="2"/>
  
  <!-- Element boxes with gradients -->
  <rect x="4" y="4" width="5.5" height="5.5" rx="1" fill="url(#ptGradient1)" opacity="0.8"/>
  <rect x="11" y="4" width="5.5" height="5.5" rx="1" fill="url(#ptGradient2)" opacity="0.8"/>
  <rect x="18" y="4" width="2.5" height="5.5" rx="1" fill="url(#ptGradient3)" opacity="0.8"/>
  
  <rect x="4" y="11" width="5.5" height="5.5" rx="1" fill="url(#ptGradient3)" opacity="0.7"/>
  <rect x="11" y="11" width="5.5" height="5.5" rx="1" fill="url(#ptGradient1)" opacity="0.7"/>
  <rect x="18" y="11" width="2.5" height="5.5" rx="1" fill="url(#ptGradient2)" opacity="0.7"/>
  
  <rect x="4" y="18" width="5.5" height="2.5" rx="1" fill="url(#ptGradient2)" opacity="0.6"/>
  <rect x="11" y="18" width="5.5" height="2.5" rx="1" fill="url(#ptGradient3)" opacity="0.6"/>
  
  <!-- Element symbols -->
  <text x="6.75" y="8" text-anchor="middle" font-size="4" font-weight="bold" fill="white">H</text>
  <text x="13.75" y="8" text-anchor="middle" font-size="4" font-weight="bold" fill="white">He</text>
  <text x="6.75" y="15" text-anchor="middle" font-size="4" font-weight="bold" fill="white">Li</text>
  <text x="13.75" y="15" text-anchor="middle" font-size="4" font-weight="bold" fill="white">Be</text>
